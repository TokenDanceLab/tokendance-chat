name: CI

# S3: concurrency + master-focused triggers (policy github-actions-ci-cd-policy.md)
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test ./...
      - run: go build ./...

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm exec tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .

  public-preview-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate compose config
        env:
          CHAT_SESSION_SECRET: ci-compose-config-secret
        run: docker compose config
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run public preview smoke against production build
        shell: bash
        run: |
          set -euo pipefail
          export CHAT_DB_PATH="$RUNNER_TEMP/tdchat-public-preview-smoke.db"
          export CHAT_FRONTEND_DIR="$GITHUB_WORKSPACE/frontend/dist"
          export CHAT_ADDR=":8199"
          export CHAT_OIDC_ENABLED="false"
          export CHAT_SESSION_SECRET="ci-public-preview-smoke-secret"
          cd "$GITHUB_WORKSPACE/backend"
          go run . > "$RUNNER_TEMP/tdchat-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/tdchat-backend.log"' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8199/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8199/api/health >/dev/null
          cd "$GITHUB_WORKSPACE/frontend"
          E2E_BASE_URL=http://127.0.0.1:8199 pnpm exec playwright test src/e2e/lightweight-chat.test.ts src/e2e/page-load.test.ts --project=chromium --workers=1 --reporter=line
          VISUAL_BASE_URL=http://127.0.0.1:8199 VISUAL_OUTPUT_DIR="$RUNNER_TEMP/tdchat-visual" pnpm run visual:acceptance
      - name: Upload visual acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance
          path: ${{ runner.temp }}/tdchat-visual
          if-no-files-found: ignore
